<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Codex 连接器</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div class="mark">C</div>
        <div>
          <p class="eyebrow">LOCAL CONNECTION</p>
          <h1>Codex 连接器</h1>
        </div>
        <span class="local">仅在这台电脑运行</span>
      </header>
      <section class="hero">
        <div>
          <p class="eyebrow">连接状态</p>
          <h2 id="status" aria-live="polite">正在检查连接…</h2>
          <p id="summary">自动发现本机 Codex，检查登录状态并读取会话。</p>
        </div>
        <button id="reconnect" class="primary">重新检测连接</button>
      </section>
      <div id="notice" role="alert" hidden></div>
      <section class="card">
        <h3>连接检查</h3>
        <div id="checks" class="checks"></div>
        <p id="installation" class="meta"></p>
        <p id="auth" class="meta"></p>
      </section>
      <details class="card">
        <summary>自动发现失败？手动指定 Codex</summary>
        <p class="meta">填写 codex.exe 的完整路径。更改只影响此连接器。</p>
        <div class="row">
          <input
            id="manualPath"
            placeholder="例如 C:\…\codex.exe"
            aria-label="Codex 程序完整路径"
          /><button id="savePath">应用并检查</button
          ><button id="autoPath">恢复自动发现</button>
        </div>
      </details>
      <section class="card">
        <div class="section-heading">
          <div>
            <h3>本机 Codex 会话</h3>
            <p class="meta">读取会话和项目位置；连接检查不会创建任务。</p>
          </div>
          <span id="count" class="badge">—</span>
        </div>
        <form id="searchForm" class="row">
          <input
            id="search"
            maxlength="200"
            placeholder="搜索会话标题"
            aria-label="搜索会话标题"
          /><button id="searchButton" type="submit">搜索</button>
        </form>
        <p id="listMessage" class="meta" aria-live="polite">
          连接成功后显示会话。
        </p>
        <div id="sessions"></div>
        <button id="more" hidden>读取更多</button>
        <div id="project" hidden>
          <h4>会话的项目目录</h4>
          <p id="projectTitle"></p>
          <code id="projectPath"></code>
          <p id="projectExists" class="meta"></p>
        </div>
      </section>
      <footer>
        <span id="lastCheck">尚未完成检查</span>
        <div>
          <button id="diagnostics">导出诊断</button
          ><button id="quit">退出连接器</button>
        </div>
      </footer>
    </main>
  </body>
</html>
